[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deskhand"
version = "0.1.0"
description = "A durable agent runtime for support operations that can act irreversibly"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["deskhand", "evals"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "eval: merge-gating trajectory evals (durability, consent, boundedness, integrity)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "S",        # flake8-bandit
]
ignore = [
    "E501",  # line length is the formatter's job, and SQL strings read better long
    "B008",  # FastAPI's Depends() in defaults is the framework's idiom
    # S101 exists because `python -O` strips asserts, so an assert standing in
    # for a security check disappears in production. Every assert here narrows
    # a type after a query that cannot return no row, and the line below it
    # would raise anyway. Converting all fifteen to explicit raises is worth
    # doing; suppressing per-site would just be that comment fifteen times.
    "S101",
]

[tool.ruff.format]
# Ruff formats Python inside Markdown fences too. The docs align their
# trailing comments into a column on purpose, and collapsing that to a single
# space is what the reader loses. Prose keeps its own formatting.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# Tests and evals reach into private helpers on purpose to assert on internals.
"tests/*" = ["E402", "S105", "S106"]
"evals/*" = ["E402"]

[tool.pyright]
# Pylance uses this. Everything is checked — including tests, evals and demo,
# which mypy's `files` setting had been quietly skipping, and which is where
# most of the first run's 30 errors turned out to be.
include = ["deskhand", "evals", "tests", "demo", "check_setup.py"]
typeCheckingMode = "standard"
# jsonschema ships no stubs. That is a fact about the package, not a defect
# here, and the alternative is a blanket suppression that would hide real ones.
reportMissingModuleSource = "none"

[tool.mypy]
# No python_version pin: it must match the interpreter in use, or mypy rejects
# dependency stubs written with newer syntax.
# Kept alongside pyright rather than replaced by it: they disagree often
# enough to be worth both, and the disagreements have been real (see
# LiteralString in deskhand/migrate.py).
files = ["deskhand", "evals", "tests", "demo", "check_setup.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
