name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Start Postgres
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' deskhand-pg 2>/dev/null || echo none)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          echo "database never became healthy"; docker compose logs db; exit 1

      - name: Preflight
        run: python check_setup.py

      - name: Migrate
        run: python -m deskhand.migrate

      - name: Tests
        run: python -m pytest -q

      # The merge gate. Asserts properties of the agent's *path* — that no
      # irreversible tool ran without consent, that a crash never double-pays,
      # that every run terminates — against the real loop and a real database.
      - name: Trajectory evals
        run: python -m evals.run

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      # High and above only. The moderate tier is mostly advisories against
      # build-time packages that never reach a browser, and a gate that cries
      # wolf gets switched off.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
      # tsc has nothing to say about a promise handed to onClick or a hook
      # called behind a condition, which is most of what breaks a React screen.
      - name: ESLint
        run: npm run lint
        working-directory: frontend
      # `npm run build` runs tsc first, so a type error fails the build rather
      # than shipping a bundle that breaks at runtime.
      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      # Full history. A key that was committed and then removed is still a key
      # that was published, and the tip of the branch will not show it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          # Pinned: an unpinned linter turns somebody else's release into a
          # red build on a pull request that changed nothing.
          pip install ruff==0.16.3 mypy==2.3.0 pyright==1.1.411 pip-audit==2.10.1
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      # Pyright is what Pylance runs, so without it in CI an editor can be full
      # of red on a build that passed. The two checkers disagree often enough
      # that running both has caught things neither found alone.
      - name: Pyright
        run: pyright
      # Reads the pinned versions rather than the installed environment, so it
      # audits what ships, not what the runner happens to have resolved.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
